  <style>
    .kartu { width: 132mm; min-height: 194mm; margin: 0 auto; background: #fff; border: 2px solid #0d3b66; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; }
    .kartu.size-a4 { width: 190mm; min-height: 267mm; }
    .kartu-header { border-bottom: 2px solid #0d3b66; padding-bottom: 8px; margin-bottom: 10px; }
    .kartu-header-row { display: flex; align-items: center; gap: 10px; }
    .kartu-header img { width: 46px; height: 46px; object-fit: contain; flex-shrink: 0; }
    .kartu-header-text { flex: 1; text-align: center; }
    .kartu-header h6 { margin: 0; color: #0d3b66; font-weight: 700; font-size: 13px; }
    .kartu-header small { font-size: 10.5px; }
    .kartu-header .kodepos { text-align: right; font-size: 10.5px; margin-top: 2px; }
    .kartu-title { text-align: center; border-bottom: 1.5px solid #0d3b66; padding-bottom: 8px; margin-bottom: 12px; color: #0d3b66; }
    .kartu-title .judul-text { font-weight: 700; font-size: 13px; text-decoration: underline; }
    .kartu-title .nomor-kp { font-weight: 600; font-size: 11px; margin-top: 4px; }
    .field-row { display: flex; font-size: 17px; margin-bottom: 14px; }
    .field-row .lbl { width: 145px; color: #555; }
    .field-row .val { flex: 1; font-weight: 600; }
    .kartu-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 10px; border-top: 1px dashed #999; }
    .qr-box { text-align: center; }
    .qr-box img { width: 128px; height: 128px; }
    .qr-box small { display: block; font-size: 11.5px; color: #555; margin-top: 3px; }
    .ttd-box { font-size: 13.5px; text-align: left; }
    .ttd-box .cetak-info { margin-bottom: 8px; }
    .ttd-signature-space { height: 55px; }
  </style>
  <style id="pageSizeStyle">@page { size: A5 portrait; margin: 8mm; }</style>

<body>
  <div class="no-print" style="max-width:600px;margin:16px auto;">
    <div class="card card-modern p-3 mb-3">
      <h6 class="fw-semibold">Isi Tanda Tangan Petugas (kosong sampai diisi manual)</h6>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">Nama Petugas</label><input class="form-control" id="ttdNama"></div>
        <div class="col-6"><label class="form-label">NIP</label><input class="form-control" id="ttdNip"></div>
        <div class="col-6">
          <label class="form-label">Ukuran Kertas Cetak</label>
          <select class="form-select" id="fUkuranKertas">
            <option value="a5">A5</option>
            <option value="a4">A4</option>
          </select>
        </div>
      </div>
      <div class="mt-2 d-flex gap-2">
        <button class="btn btn-primary btn-sm" id="btnSimpanTtd">Simpan Tanda Tangan</button>
        <button class="btn btn-outline-dark btn-sm" id="btnCetak"><i class="fa-solid fa-print"></i> Cetak / Download PDF</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="history.back()">Kembali</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/config.js"></script>

  <script src="js/app.js"></script>
  <script>
    if (!requireLogin()) {}
    const kendaraanId = (new URLSearchParams(location.search).get('id') || '');

    (function () {
      const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      const now = new Date();
      document.getElementById('tglCetak').textContent = now.getDate() + ' ' + bulan[now.getMonth()] + ' ' + now.getFullYear();
    })();

    function baris(label, val) {
      return '<div class="field-row"><div class="lbl">' + label + '</div><div class="val">: ' + val + '</div></div>';
    }

    callServer('api_getKendaraanById', kendaraanId).then(function (d) {
      if (!d) { document.getElementById('dataArea').innerHTML = '<p class="text-danger text-center">Data tidak ditemukan.</p>'; return; }

      callServer('api_cekSanksiKendaraan', kendaraanId).then(function (sanksi) {
        if (sanksi) {
          tampilkanPenolakan(d, sanksi);
          return;
        }
        callServer('api_cekKelengkapanKendaraan', kendaraanId).then(function (k) {
          if (!k.lulus) {
            tampilkanPenolakanKelengkapan(d, k);
            return;
          }
          lanjutkanCetakKartu(d);
        });
      });
    });

    function tampilkanPenolakan(d, sanksi) {
      document.getElementById('kartuArea').innerHTML =
        '<div class="text-center" style="padding:20px 10px;">' +
          '<i class="fa-solid fa-ban" style="font-size:48px; color:#b5171f;"></i>' +
          '<h5 class="fw-bold mt-3" style="color:#b5171f;">Kartu Pengawasan Tidak Dapat Diterbitkan</h5>' +
          '<p class="text-muted mb-4" style="font-size:13px;">Kendaraan berikut sedang dikenakan sanksi/penindakan sehingga permohonan Kartu Pengawasan ditolak.</p>' +
        '</div>' +
        '<div style="font-size:13px; text-align:left;">' +
          baris('Nomor Polisi', d.NOMOR_POLISI) +
          baris('Jenis Sanksi', '<span style="color:#b5171f; font-weight:700;">' + sanksi.JENIS_SANKSI + '</span>') +
          baris('Dasar Pasal', sanksi.DASAR_PASAL || '-') +
          baris('Alasan', sanksi.ALASAN || '-') +
          baris('Tanggal Mulai', sanksi.TANGGAL_MULAI ? new Date(sanksi.TANGGAL_MULAI).toLocaleDateString('id-ID') : '-') +
          (sanksi.TANGGAL_BERAKHIR ? baris('Berlaku Sampai', new Date(sanksi.TANGGAL_BERAKHIR).toLocaleDateString('id-ID')) : '') +
        '</div>' +
        '<div class="text-center mt-4">' +
          '<button class="btn btn-outline-secondary btn-sm" onclick="history.back()">Kembali</button>' +
        '</div>';
      document.querySelector('.no-print').style.display = 'none';
    }

    function tampilkanPenolakanKelengkapan(d, k) {
      const daftarHtml = k.daftarBermasalah.map(function (item) {
        return '<li>' + item.label + ' &mdash; <span style="color:#b5171f;">' + item.keterangan + '</span></li>';
      }).join('');
      document.getElementById('kartuArea').innerHTML =
        '<div class="text-center" style="padding:20px 10px;">' +
          '<i class="fa-solid fa-clipboard-question" style="font-size:48px; color:#b5171f;"></i>' +
          '<h5 class="fw-bold mt-3" style="color:#b5171f;">Kartu Pengawasan Tidak Dapat Diterbitkan</h5>' +
          '<p class="text-muted mb-2" style="font-size:13px;">Kelengkapan kendaraan belum memenuhi syarat minimal 50% sesuai Pasal 134 ayat (1) Perda Kota Balikpapan No. 7 Tahun 2022.</p>' +
          '<div class="mb-3"><span class="badge" style="background:#b5171f; font-size:16px; padding:8px 18px;">' + k.persentase + '% (' + k.jumlahLulus + ' dari ' + k.totalItem + ' item)</span></div>' +
        '</div>' +
        '<div style="font-size:13px; text-align:left;">' +
          baris('Nomor Polisi', d.NOMOR_POLISI) +
          (k.belumPernahDicek ? baris('Status', '<span style="color:#b5171f; font-weight:700;">Belum Pernah Dicek Sama Sekali</span>') :
            baris('Tanggal Cek Terakhir', k.tanggalCek ? new Date(k.tanggalCek).toLocaleDateString('id-ID') : '-')) +
        '</div>' +
        '<div class="mt-3">' +
          '<div class="fw-semibold mb-1" style="font-size:13px;">Item Bermasalah:</div>' +
          '<ul style="font-size:12.5px;">' + daftarHtml + '</ul>' +
        '</div>' +
        '<div class="text-center mt-3 d-flex gap-2 justify-content-center flex-wrap">' +
          '<button class="btn btn-primary btn-sm" onclick="gotoPage(\'cek-kendaraan\')"><i class="fa-solid fa-clipboard-check"></i> Cek Ulang Kelengkapan</button>' +
          '<button class="btn btn-outline-secondary btn-sm" onclick="history.back()">Kembali</button>' +
        '</div>';
      document.querySelector('.no-print').style.display = 'none';
    }

    function lanjutkanCetakKartu(d) {
      callServer('api_getMasterData').then(function (res) {
        const t = res.trayek.filter(function (x) { return String(x.ID_TRAYEK) === String(d.ID_TRAYEK); })[0];
        const p = res.perusahaan.filter(function (x) { return String(x.ID_PERUSAHAAN) === String(d.ID_PERUSAHAAN); })[0];
        document.getElementById('nomorKP').textContent = 'Nomor KP : 500.11.10.2/' + d.ID_KENDARAAN + '/DISHUB';
        document.getElementById('dataArea').innerHTML =
          '<div style="font-size:14px; text-align:justify; margin-bottom:16px;">Berdasarkan Peraturan Daerah Kota Balikpapan Nomor 7 Tahun 2022, Dinas Perhubungan Kota Balikpapan memberikan Kartu Pengawasan kepada :</div>' +
          baris('Nomor Polisi', d.NOMOR_POLISI) +
          baris('Nama Pemilik', d.NAMA_PEMILIK || '-') + baris('Nama Perusahaan', p ? p.NAMA_PERUSAHAAN : '-') +
          baris('Trayek', t ? t.NAMA_TRAYEK : '-') +
          baris('Masa Berlaku', d.MASA_BERLAKU ? new Date(d.MASA_BERLAKU).toLocaleDateString('id-ID') : '-');
      });
      callServer('api_getQrUrl', kendaraanId).then(function (url) { document.getElementById('qrImg').src = url; });
    }

    callServer('api_getTandaTangan', 'kartu').then(function (t) {
      document.getElementById('ttdNama').value = t.nama || '';
      document.getElementById('ttdNip').value = t.nip || '';
      document.getElementById('ttdNamaCetak').textContent = t.nama || '\u00A0';
      document.getElementById('ttdNipCetak').textContent = t.nip || '\u00A0';
    });

    document.getElementById('btnSimpanTtd').addEventListener('click', function () {
      const nama = document.getElementById('ttdNama').value.trim();
      const nip = document.getElementById('ttdNip').value.trim();
      callServer('api_setTandaTangan', 'kartu', nama, nip).then(function () {
        document.getElementById('ttdNamaCetak').textContent = nama || '\u00A0';
        document.getElementById('ttdNipCetak').textContent = nip || '\u00A0';
        toastSukses('Tanda tangan disimpan');
      });
    });

    function terapkanUkuranKertas() {
      const ukuran = document.getElementById('fUkuranKertas').value;
      const kartuEl = document.getElementById('kartuArea');
      const pageStyle = document.getElementById('pageSizeStyle');
      if (ukuran === 'a4') {
        kartuEl.classList.add('size-a4');
        pageStyle.textContent = '@page { size: A4 portrait; margin: 12mm; }';
      } else {
        kartuEl.classList.remove('size-a4');
        pageStyle.textContent = '@page { size: A5 portrait; margin: 8mm; }';
      }
    }
    document.getElementById('fUkuranKertas').addEventListener('change', terapkanUkuranKertas);

    document.getElementById('btnCetak').addEventListener('click', function () {
      terapkanUkuranKertas();
      window.print();
    });
  </script>
</body>
</html>
