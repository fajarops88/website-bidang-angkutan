<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMAU - Dinas Perhubungan Kota Balikpapan</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    @page { size: A4 portrait; margin: 15mm; }
    .lap-header { text-align: center; border-bottom: 3px solid #0d3b66; padding-bottom: 10px; margin-bottom: 16px; }
    .lap-header img { width: 50px; }
    .lap-header h5 { color: #0d3b66; font-weight: 700; margin: 6px 0 0; }
    .ttd-box { margin-top: 40px; text-align: right; font-size: 13px; }
    .ttd-box .inner { display: inline-block; text-align: center; min-width: 240px; }
    .badge-baru { background: #ffd9dc; color: #b5171f; font-weight: 600; }
    .badge-proses { background: #fff3cd; color: #997404; font-weight: 600; }
    .badge-selesai { background: #d1f4e0; color: #0f7b3f; font-weight: 600; }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d3b66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SIMAU">
</head>
<body>
  <div id="sidebarMount"></div>
  <div class="simantas-content">
    <div id="topbarMount"></div>
    <div class="page-body">
      <div class="card card-modern p-3 mb-3 no-print">
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="fStatus">
              <option value="">Semua Status</option>
              <option value="Diterima">Diterima</option>
              <option value="Diproses">Diproses</option>
              <option value="Selesai">Selesai</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Jenis Laporan</label>
            <select class="form-select" id="fJenis">
              <option value="">Semua Jenis</option>
              <option value="Pengaduan Masyarakat">Pengaduan Masyarakat</option>
              <option value="Temuan Petugas">Temuan Petugas Lapangan</option>
            </select>
          </div>
          <div class="col-md-2"><button class="btn btn-primary w-100" id="btnFilter"><i class="fa-solid fa-magnifying-glass"></i> Tampilkan</button></div>
          <div class="col-md-2"><button class="btn btn-outline-dark w-100" id="btnCetak"><i class="fa-solid fa-print"></i> Cetak PDF</button></div>
          <div class="col-md-2"><button class="btn btn-outline-success w-100" id="btnExport"><i class="fa-solid fa-file-excel"></i> Export Excel</button></div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-4"><label class="form-label">Jabatan Penandatangan</label><input class="form-control" id="ttdJabatan" placeholder="KEPALA BIDANG ANGKUTAN"></div>
          <div class="col-md-4"><label class="form-label">Nama Petugas</label><input class="form-control" id="ttdNama"></div>
          <div class="col-md-4"><label class="form-label">NIP</label><input class="form-control" id="ttdNip"></div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-4 d-flex align-items-end"><button class="btn btn-secondary w-100" id="btnSimpanTtd">Simpan Tanda Tangan</button></div>
        </div>
      </div>

      <div class="card card-modern p-4" id="cetakArea">
        <div class="lap-header">
          <img src="https://upload.wikimedia.org/wikipedia/id/thumb/f/f4/Lambang_Kota_Balikpapan.png/120px-Lambang_Kota_Balikpapan.png" onerror="this.style.display='none'">
          <h5>REKAP LAPORAN PENGADUAN MASYARAKAT / TEMUAN PETUGAS</h5>
          <small>Dinas Perhubungan Kota Balikpapan &mdash; Tanggal Cetak: <span id="judulTanggal">-</span></small>
        </div>

        <div class="row text-center mb-3">
          <div class="col-3"><div class="fw-bold fs-4" id="sumTotal">0</div><small>Total Laporan</small></div>
          <div class="col-3"><div class="fw-bold fs-4 text-danger" id="sumBaru">0</div><small>Diterima</small></div>
          <div class="col-3"><div class="fw-bold fs-4 text-warning" id="sumProses">0</div><small>Diproses</small></div>
          <div class="col-3"><div class="fw-bold fs-4 text-success" id="sumSelesai">0</div><small>Selesai</small></div>
        </div>

        <table class="table table-bordered table-sm">
          <thead><tr>
            <th>No</th><th>No. Polisi</th><th>Jenis</th><th>Pelapor</th><th>Deskripsi</th><th>Status</th><th>Tanggal Lapor</th>
          </tr></thead>
          <tbody id="tbodyLaporan"></tbody>
        </table>

        <div class="ttd-box">
          <div class="inner">
            MENGETAHUI<br><span id="ttdJabatanCetak" style="font-weight:700;">KEPALA BIDANG ANGKUTAN</span><br><br><br><br>
            <span id="ttdNamaCetak" style="font-weight:700; text-decoration:underline;">&nbsp;</span><br>
            <span id="ttdNipCetak">&nbsp;</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!requireLogin()) {}
    setupSidebar('laporan-pengaduan');
    initTopbar('Rekap Pengaduan');

    let pengaduanData = [];

    (function () {
      const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      const now = new Date();
      document.getElementById('judulTanggal').textContent = now.getDate() + ' ' + bulan[now.getMonth()] + ' ' + now.getFullYear();
    })();

    callServer('api_getTandaTangan', 'laporan-pengaduan').then(function (t) {
      document.getElementById('ttdNama').value = t.nama || '';
      document.getElementById('ttdNip').value = t.nip || '';
      document.getElementById('ttdJabatan').value = t.jabatan || '';
      document.getElementById('ttdNamaCetak').textContent = t.nama || '\u00A0';
      document.getElementById('ttdNipCetak').textContent = t.nip || '\u00A0';
      document.getElementById('ttdJabatanCetak').textContent = t.jabatan || 'KEPALA BIDANG ANGKUTAN';
    });

    document.getElementById('btnSimpanTtd').addEventListener('click', function () {
      const nama = document.getElementById('ttdNama').value.trim();
      const nip = document.getElementById('ttdNip').value.trim();
      const jabatan = document.getElementById('ttdJabatan').value.trim();
      callServer('api_setTandaTangan', 'laporan-pengaduan', nama, nip, jabatan).then(function () {
        document.getElementById('ttdNamaCetak').textContent = nama || '\u00A0';
        document.getElementById('ttdNipCetak').textContent = nip || '\u00A0';
        document.getElementById('ttdJabatanCetak').textContent = jabatan || 'KEPALA BIDANG ANGKUTAN';
        toastSukses('Tanda tangan disimpan');
      });
    });

    function badgeStatus(status) {
      if (status === 'Diproses') return '<span class="badge badge-proses">Diproses</span>';
      if (status === 'Selesai') return '<span class="badge badge-selesai">Selesai</span>';
      return '<span class="badge badge-baru">Diterima</span>';
    }

    let lastRows = [];
    function tampilkan() {
      const statusFilter = document.getElementById('fStatus').value;
      const jenisFilter = document.getElementById('fJenis').value;
      let rows = pengaduanData;
      if (statusFilter) rows = rows.filter(function (r) { return r.STATUS === statusFilter; });
      if (jenisFilter) rows = rows.filter(function (r) { return r.JENIS_LAPORAN === jenisFilter; });
      lastRows = rows;

      document.getElementById('sumTotal').textContent = rows.length;
      document.getElementById('sumBaru').textContent = rows.filter(function (r) { return r.STATUS === 'Diterima'; }).length;
      document.getElementById('sumProses').textContent = rows.filter(function (r) { return r.STATUS === 'Diproses'; }).length;
      document.getElementById('sumSelesai').textContent = rows.filter(function (r) { return r.STATUS === 'Selesai'; }).length;

      document.getElementById('tbodyLaporan').innerHTML = rows.map(function (r, i) {
        const deskripsiSingkat = (r.DESKRIPSI || '').length > 60 ? r.DESKRIPSI.substring(0, 60) + '...' : (r.DESKRIPSI || '-');
        return '<tr><td>' + (i + 1) + '</td><td>' + escHtml_(r.NOMOR_POLISI || '-') + '</td><td>' + escHtml_(r.JENIS_LAPORAN || '-') + '</td>' +
          '<td>' + escHtml_(r.NAMA_PELAPOR || 'Anonim') + '</td><td>' + escHtml_(deskripsiSingkat) + '</td>' +
          '<td>' + badgeStatus(r.STATUS) + '</td>' +
          '<td>' + (r.TANGGAL_LAPOR ? new Date(r.TANGGAL_LAPOR).toLocaleDateString('id-ID') : '-') + '</td></tr>';
      }).join('') || '<tr><td colspan="7" class="text-center text-muted">Tidak ada data</td></tr>';
    }

    callServer('api_listPengaduan').then(function (rows) {
      pengaduanData = rows || [];
      tampilkan();
    });

    document.getElementById('btnFilter').addEventListener('click', tampilkan);
    document.getElementById('btnCetak').addEventListener('click', function () { window.print(); });
    document.getElementById('btnExport').addEventListener('click', function () {
      if (!lastRows.length) { Swal.fire({ icon: 'info', title: 'Tidak ada data untuk diexport' }); return; }
      const rows = lastRows.map(function (r) {
        return {
          NOMOR_POLISI: r.NOMOR_POLISI || '-',
          JENIS_LAPORAN: r.JENIS_LAPORAN || '-',
          NAMA_PELAPOR: r.NAMA_PELAPOR || 'Anonim',
          KONTAK_PELAPOR: r.KONTAK_PELAPOR || '-',
          DESKRIPSI: r.DESKRIPSI || '-',
          STATUS: r.STATUS || '-',
          CATATAN_PETUGAS: r.CATATAN_PETUGAS || '-',
          TANGGAL_LAPOR: r.TANGGAL_LAPOR || ''
        };
      });
      callServer('api_exportExcel', 'Rekap_Pengaduan', rows).then(function (res) {
        window.open(res.url, '_blank');
      });
    });
  </script>
</body>
</html>
