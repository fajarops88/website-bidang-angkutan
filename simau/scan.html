<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status Kendaraan - SIMAU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: linear-gradient(135deg,#0d3b66,#1d7a8c); min-height:100vh; padding:24px 16px; }
    .scan-card { max-width:460px; width:100%; margin:0 auto; }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d3b66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SIMAU">
</head>
<body>
  <div class="card card-modern p-4 scan-card">
    <div class="text-center mb-3">
      <img src="https://upload.wikimedia.org/wikipedia/id/thumb/f/f4/Lambang_Kota_Balikpapan.png/120px-Lambang_Kota_Balikpapan.png" style="width:48px;" alt="Logo" onerror="this.style.display='none'">
      <h6 class="fw-bold mt-2 mb-0" style="color:#0d3b66;">Status Kendaraan Angkutan Umum</h6>
      <small class="text-muted">Dinas Perhubungan Kota Balikpapan</small>
    </div>
    <div id="hasil"><div class="text-center py-4"><div class="spinner-border text-primary"></div></div></div>
    <p class="text-center text-muted mt-3 mb-0" style="font-size:12px;">SIMAU - Sistem Informasi Manajemen Angkutan Umum</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const kendaraanId = new URLSearchParams(location.search).get('id') || '';

    function baris(label, val) {
      return '<div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted" style="font-size:13px;">' + label +
             '</span><span class="fw-semibold" style="font-size:13.5px;">' + val + '</span></div>';
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function tampilkan(d) {
      const el = document.getElementById('hasil');
      if (!d) {
        el.innerHTML = '<div class="alert alert-warning text-center mb-0" style="font-size:13.5px;"><i class="fa-solid fa-triangle-exclamation"></i> Data kendaraan tidak ditemukan.</div>';
        return;
      }
      const aktif = d.STATUS_AKTIF === 'AKTIF';
      const warna = aktif ? '#2a9d8f' : '#e63946';
      const ikon = aktif ? 'fa-circle-check' : 'fa-circle-xmark';
      el.innerHTML =
        '<div class="text-center mb-3"><span class="badge" style="background:' + warna + '; font-size:16px; padding:10px 22px;">' +
        '<i class="fa-solid ' + ikon + '"></i> ' + esc(d.STATUS_AKTIF) + '</span></div>' +
        baris('Nomor Polisi', esc(d.NOMOR_POLISI)) +
        baris('Nama Pemilik', esc(d.NAMA_PEMILIK)) +
        baris('Perusahaan', esc(d.NAMA_PERUSAHAAN)) +
        baris('Trayek', esc(d.NAMA_TRAYEK)) +
        baris('Masa Berlaku', d.MASA_BERLAKU ? new Date(d.MASA_BERLAKU).toLocaleDateString('id-ID') : '-');
    }

    if (!kendaraanId) {
      tampilkan(null);
    } else {
      google.script.run
        .withSuccessHandler(tampilkan)
        .withFailureHandler(function () {
          document.getElementById('hasil').innerHTML = '<p class="text-danger text-center mt-3">Gagal memuat data. Coba lagi.</p>';
        })
        .api_publicKendaraan(kendaraanId);
    }
  </script>
</body>
</html>
