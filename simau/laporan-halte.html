<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMAU - Dinas Perhubungan Kota Balikpapan</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    @page { size: A4 portrait; margin: 15mm; }
    .lap-header { text-align: center; border-bottom: 3px solid #0d3b66; padding-bottom: 10px; margin-bottom: 16px; }
    .lap-header img { width: 50px; }
    .lap-header h5 { color: #0d3b66; font-weight: 700; margin: 6px 0 0; }
    .ttd-box { margin-top: 40px; text-align: right; font-size: 13px; }
    .ttd-box .inner { display: inline-block; text-align: center; min-width: 240px; }
    .ttd-line { border-bottom: 1px solid #333; display: inline-block; min-width: 200px; }
    .badge-kecil { font-size: 10.5px; padding: 3px 7px; border-radius: 4px; margin-right: 3px; display: inline-block; }
  </style>
</head>
<body>
  <div id="sidebarMount"></div>
  <div class="simantas-content">
    <div id="topbarMount"></div>
    <div class="page-body">
      <div class="card card-modern p-3 mb-3 no-print">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Tampilkan</label>
            <select class="form-select" id="fFilter">
              <option value="semua">Semua Halte</option>
              <option value="buruk">Hanya yang Ada Kondisi Buruk</option>
              <option value="tidakada">Hanya yang Ada Fasilitas Tidak Ada</option>
            </select>
          </div>
          <div class="col-md-2"><button class="btn btn-primary w-100" id="btnFilter"><i class="fa-solid fa-magnifying-glass"></i> Tampilkan</button></div>
          <div class="col-md-3"><button class="btn btn-outline-dark w-100" id="btnCetak"><i class="fa-solid fa-print"></i> Cetak PDF</button></div>
          <div class="col-md-3"><button class="btn btn-outline-success w-100" id="btnExport"><i class="fa-solid fa-file-excel"></i> Export Excel</button></div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-4"><label class="form-label">Jabatan Penandatangan</label><input class="form-control" id="ttdJabatan" placeholder="KEPALA BIDANG PRASARANA"></div>
          <div class="col-md-4"><label class="form-label">Nama Petugas (untuk tanda tangan)</label><input class="form-control" id="ttdNama"></div>
          <div class="col-md-4"><label class="form-label">NIP</label><input class="form-control" id="ttdNip"></div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-4 d-flex align-items-end"><button class="btn btn-secondary w-100" id="btnSimpanTtd">Simpan Tanda Tangan</button></div>
        </div>
      </div>

      <div class="card card-modern p-4" id="cetakArea">
        <div class="lap-header">
          <img src="https://upload.wikimedia.org/wikipedia/id/thumb/f/f4/Lambang_Kota_Balikpapan.png/120px-Lambang_Kota_Balikpapan.png" onerror="this.style.display='none'">
          <h5>LAPORAN DATA FASILITAS HALTE</h5>
          <small>Dinas Perhubungan Kota Balikpapan &mdash; Tanggal Cetak: <span id="judulTanggal">-</span></small>
        </div>

        <div class="row text-center mb-3">
          <div class="col"><div class="fw-bold fs-4" id="sumHalte">0</div><small>Total Halte</small></div>
          <div class="col"><div class="fw-bold fs-4 text-primary" id="sumAda">0</div><small>Item Ada</small></div>
          <div class="col"><div class="fw-bold fs-4 text-success" id="sumBaik">0</div><small>Item Baik</small></div>
          <div class="col"><div class="fw-bold fs-4 text-danger" id="sumBuruk">0</div><small>Item Buruk</small></div>
          <div class="col"><div class="fw-bold fs-4 text-secondary" id="sumTidakAda">0</div><small>Item Tidak Ada</small></div>
        </div>

        <table class="table table-bordered table-sm">
          <thead><tr>
            <th>No</th><th>Nama Halte</th><th>Ada</th><th>Baik</th><th>Buruk</th><th>Tidak Ada</th><th>Petugas Input</th><th>Tanggal Input</th>
          </tr></thead>
          <tbody id="tbodyLaporan"></tbody>
        </table>

        <div class="ttd-box">
          <div class="inner">
            MENGETAHUI<br><span id="ttdJabatanCetak" style="font-weight:700;">KEPALA BIDANG PRASARANA</span><br><br><br><br>
            <span id="ttdNamaCetak" style="font-weight:700; text-decoration:underline;">&nbsp;</span><br>
            <span id="ttdNipCetak">&nbsp;</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!requireLogin()) {}
    setupSidebar('laporan-halte');
    initTopbar('Laporan Fasilitas Halte');

    let fasilitasList = [], halteData = [];

    (function () {
      const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      const now = new Date();
      document.getElementById('judulTanggal').textContent = now.getDate() + ' ' + bulan[now.getMonth()] + ' ' + now.getFullYear();
    })();

    callServer('api_getTandaTangan', 'laporan-halte').then(function (t) {
      document.getElementById('ttdNama').value = t.nama || '';
      document.getElementById('ttdNip').value = t.nip || '';
      document.getElementById('ttdJabatan').value = t.jabatan || '';
      document.getElementById('ttdNamaCetak').textContent = t.nama || '\u00A0';
      document.getElementById('ttdNipCetak').textContent = t.nip || '\u00A0';
      document.getElementById('ttdJabatanCetak').textContent = t.jabatan || 'KEPALA BIDANG PRASARANA';
    });

    document.getElementById('btnSimpanTtd').addEventListener('click', function () {
      const nama = document.getElementById('ttdNama').value.trim();
      const nip = document.getElementById('ttdNip').value.trim();
      const jabatan = document.getElementById('ttdJabatan').value.trim();
      callServer('api_setTandaTangan', 'laporan-halte', nama, nip, jabatan).then(function () {
        document.getElementById('ttdNamaCetak').textContent = nama || '\u00A0';
        document.getElementById('ttdNipCetak').textContent = nip || '\u00A0';
        document.getElementById('ttdJabatanCetak').textContent = jabatan || 'KEPALA BIDANG PRASARANA';
        toastSukses('Tanda tangan disimpan');
      });
    });

    function hitungKondisi(item) {
      let ada = 0, baik = 0, buruk = 0, tidakAda = 0;
      (fasilitasList || []).forEach(function (f) {
        const ket = item[f.key + '_KET'];
        const kondisi = item[f.key + '_KONDISI'];
        if (ket === 'Ada') ada++;
        if (ket === 'Tidak') tidakAda++;
        if (kondisi === 'Baik') baik++;
        else if (kondisi === 'Buruk') buruk++;
      });
      return { ada: ada, baik: baik, buruk: buruk, tidakAda: tidakAda };
    }

    let lastRows = [];
    function tampilkan() {
      const filter = document.getElementById('fFilter').value;
      let rows = halteData.map(function (r) {
        const k = hitungKondisi(r);
        return Object.assign({}, r, k);
      });
      if (filter === 'buruk') rows = rows.filter(function (r) { return r.buruk > 0; });
      if (filter === 'tidakada') rows = rows.filter(function (r) { return r.tidakAda > 0; });
      lastRows = rows;

      let totalAda = 0, totalBaik = 0, totalBuruk = 0, totalTidakAda = 0;
      rows.forEach(function (r) { totalAda += r.ada; totalBaik += r.baik; totalBuruk += r.buruk; totalTidakAda += r.tidakAda; });
      document.getElementById('sumHalte').textContent = rows.length;
      document.getElementById('sumAda').textContent = totalAda;
      document.getElementById('sumBaik').textContent = totalBaik;
      document.getElementById('sumBuruk').textContent = totalBuruk;
      document.getElementById('sumTidakAda').textContent = totalTidakAda;

      document.getElementById('tbodyLaporan').innerHTML = rows.map(function (r, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + r.NAMA_HALTE + '</td>' +
          '<td class="text-center text-primary fw-semibold">' + r.ada + '</td>' +
          '<td class="text-center text-success fw-semibold">' + r.baik + '</td>' +
          '<td class="text-center text-danger fw-semibold">' + r.buruk + '</td>' +
          '<td class="text-center text-secondary fw-semibold">' + r.tidakAda + '</td>' +
          '<td>' + (r.PETUGAS_INPUT || '-') + '</td>' +
          '<td>' + (r.TANGGAL_INPUT ? new Date(r.TANGGAL_INPUT).toLocaleDateString('id-ID') : '-') + '</td></tr>';
      }).join('') || '<tr><td colspan="8" class="text-center text-muted">Tidak ada data</td></tr>';
    }

    Promise.all([callServer('api_getFasilitasList'), callServer('api_listHalte')]).then(function (res) {
      fasilitasList = res[0];
      halteData = res[1] || [];
      tampilkan();
    });

    document.getElementById('btnFilter').addEventListener('click', tampilkan);
    document.getElementById('btnCetak').addEventListener('click', function () { window.print(); });
    document.getElementById('btnExport').addEventListener('click', function () {
      if (!lastRows.length) { Swal.fire({ icon: 'info', title: 'Tidak ada data untuk diexport' }); return; }
      const rows = lastRows.map(function (r) {
        return {
          NAMA_HALTE: r.NAMA_HALTE,
          ADA: r.ada, BAIK: r.baik, BURUK: r.buruk, TIDAK_ADA: r.tidakAda,
          PETUGAS_INPUT: r.PETUGAS_INPUT || '-',
          TANGGAL_INPUT: r.TANGGAL_INPUT || ''
        };
      });
      callServer('api_exportExcel', 'Laporan_Fasilitas_Halte', rows).then(function (res) {
        window.open(res.url, '_blank');
      });
    });
  </script>
</body>
</html>
