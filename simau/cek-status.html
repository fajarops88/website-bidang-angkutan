<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMAU - Dinas Perhubungan Kota Balikpapan</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: linear-gradient(135deg,#0d3b66,#1d7a8c); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .cek-card { max-width:440px; width:100%; }
  </style>
</head>
<body>
  <div class="card card-modern p-4 cek-card">
    <div class="text-center mb-3">
      <img src="https://upload.wikimedia.org/wikipedia/id/thumb/f/f4/Lambang_Kota_Balikpapan.png/120px-Lambang_Kota_Balikpapan.png" style="width:48px;" onerror="this.style.display='none'">
      <h6 class="fw-bold mt-2 mb-0" style="color:#0d3b66;">Cek Status Kendaraan</h6>
      <small class="text-muted">Dinas Perhubungan Kota Balikpapan &mdash; Untuk Petugas Lapangan</small>
    </div>

    <div class="input-group mb-3">
      <input type="text" class="form-control" id="fNopol" placeholder="Contoh: KT 1234 BC" style="text-transform:uppercase;">
      <button class="btn btn-primary" id="btnCek"><i class="fa-solid fa-magnifying-glass"></i> Cek</button>
    </div>

    <div id="hasil"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    function baris(label, val) {
      return '<div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted" style="font-size:13px;">' + label + '</span><span class="fw-semibold" style="font-size:13.5px;">' + val + '</span></div>';
    }

    function cekStatus() {
      const nopol = document.getElementById('fNopol').value.trim();
      if (!nopol) {
        Swal.fire({ icon: 'warning', title: 'Isi dulu', text: 'Masukkan Nomor Polisi kendaraan.' });
        return;
      }
      document.getElementById('hasil').innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
      google.script.run
        .withSuccessHandler(tampilkan)
        .withFailureHandler(function (err) {
          document.getElementById('hasil').innerHTML = '<p class="text-danger text-center mt-3">Gagal memuat data. Coba lagi.</p>';
        })
        .api_publicCekStatusNopol(nopol);
    }

    function tampilkan(d) {
      if (!d) {
        document.getElementById('hasil').innerHTML =
          '<div class="alert alert-warning text-center mt-2 mb-0" style="font-size:13.5px;">' +
          '<i class="fa-solid fa-triangle-exclamation"></i> Nomor Polisi tidak ditemukan di database.<br>Pastikan penulisan sudah benar.' +
          '</div>';
        return;
      }
      const aktif = d.STATUS_AKTIF === 'AKTIF';
      const warna = d.DIBLOKIR ? '#7a1f2b' : (aktif ? '#2a9d8f' : '#e63946');
      const ikon = d.DIBLOKIR ? 'fa-ban' : (aktif ? 'fa-circle-check' : 'fa-circle-xmark');
      const labelBadge = d.DIBLOKIR ? 'DIBLOKIR' : d.STATUS_AKTIF;
      document.getElementById('hasil').innerHTML =
        '<div class="text-center mb-3">' +
          '<span class="badge" style="background:' + warna + '; font-size:16px; padding:10px 22px;"><i class="fa-solid ' + ikon + '"></i> ' + labelBadge + '</span>' +
        '</div>' +
        (d.DIBLOKIR ? '<div class="alert alert-danger text-center" style="font-size:12.5px;">Kendaraan ini sedang dikenakan sanksi: <strong>' + d.JENIS_SANKSI + '</strong></div>' : '') +
        baris('Nomor Polisi', d.NOMOR_POLISI) +
        baris('Trayek', d.NAMA_TRAYEK) +
        baris('Perusahaan', d.NAMA_PERUSAHAAN) +
        baris('Masa Berlaku', d.MASA_BERLAKU ? new Date(d.MASA_BERLAKU).toLocaleDateString('id-ID') : '-');
    }

    document.getElementById('btnCek').addEventListener('click', cekStatus);
    document.getElementById('fNopol').addEventListener('keydown', function (e) { if (e.key === 'Enter') cekStatus(); });
    document.getElementById('fNopol').focus();
  </script>
</body>
</html>
