<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMAU - Dinas Perhubungan Kota Balikpapan</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
</head>
<body>
  <div id="sidebarMount"></div>
  <div class="simantas-content">
    <div id="topbarMount"></div>
    <div class="page-body">
      <div class="card card-modern p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-semibold mb-0">Data User</h6>
          <button class="btn btn-primary btn-sm" id="btnTambah"><i class="fa-solid fa-plus"></i> Tambah User</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="tblData" style="width:100%">
            <thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Status</th><th class="no-print">Aksi</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h6 class="modal-title" id="formModalTitle">Tambah User</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="fRow"><input type="hidden" id="fId">
        <div class="mb-2">
          <label class="form-label">Username</label>
          <input class="form-control" id="fUsername" placeholder="tanpa spasi, huruf kecil">
        </div>
        <div class="mb-2">
          <label class="form-label">Nama Lengkap</label>
          <input class="form-control" id="fNama">
        </div>
        <div class="mb-2">
          <label class="form-label">Role</label>
          <select class="form-select" id="fRole">
            <option value="ADMINISTRATOR">ADMINISTRATOR</option>
            <option value="PETUGAS ANGKUTAN">PETUGAS ANGKUTAN</option>
            <option value="PEMILIK KENDARAAN">PEMILIK KENDARAAN</option>
            <option value="ADMIN KONTEN">ADMIN KONTEN (panel website saja)</option>
          </select>
        </div>
        <div class="mb-2" id="areaIdPemilik" style="display:none;">
          <label class="form-label">Nama Pemilik (harus persis sama dengan Nama Pemilik di Data Kendaraan)</label>
          <input class="form-control" id="fIdPemilik">
        </div>
        <div class="mb-2">
          <label class="form-label">Status</label>
          <select class="form-select" id="fStatus">
            <option value="AKTIF">AKTIF</option>
            <option value="NONAKTIF">NONAKTIF</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label" id="lblPassword">Password</label>
          <input type="text" class="form-control" id="fPassword" placeholder="Kosongkan jika tidak ingin mengubah password">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" id="btnSimpan">Simpan</button>
      </div>
    </div></div>
  </div>

  <script>
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script>
    if (!requireLogin()) {}
    setupSidebar('data-user');
    initTopbar('Data User');

    let dt, formModal, dataCache = [];

    document.addEventListener('DOMContentLoaded', function () {
      formModal = new bootstrap.Modal(document.getElementById('formModal'));
      dt = $('#tblData').DataTable({ language: { url: 'https://cdn.datatables.net/plug-ins/1.13.8/i18n/id.json' } });
      muatData();
    });

    document.getElementById('fRole').addEventListener('change', function () {
      document.getElementById('areaIdPemilik').style.display = (this.value === 'PEMILIK KENDARAAN') ? 'block' : 'none';
    });

    function muatData() {
      callServer('api_listUsers').then(function (rows) {
        dataCache = rows;
        dt.clear();
        rows.forEach(function (r) {
          const statusBadge = r.STATUS === 'AKTIF'
            ? '<span class="badge badge-aktif">AKTIF</span>' : '<span class="badge badge-tidak">NONAKTIF</span>';
          dt.row.add([
            r.USERNAME, r.NAMA, r.ROLE, statusBadge,
            '<button class="btn btn-sm btn-outline-primary btnEdit" data-row="' + r._row + '" title="Edit"><i class="fa-solid fa-pen"></i></button> ' +
            '<button class="btn btn-sm btn-outline-danger btnHapus" data-row="' + r._row + '" title="Hapus"><i class="fa-solid fa-trash"></i></button>'
          ]);
        });
        dt.draw();
        bindRowActions();
      });
    }

    function bindRowActions() {
      $('#tblData').off('click', '.btnEdit').on('click', '.btnEdit', function () {
        const row = Number($(this).data('row'));
        const item = dataCache.filter(function (d) { return d._row === row; })[0];
        document.getElementById('formModalTitle').textContent = 'Edit User';
        document.getElementById('fRow').value = item._row;
        document.getElementById('fId').value = item.ID_USER;
        document.getElementById('fUsername').value = item.USERNAME;
        document.getElementById('fUsername').disabled = true;
        document.getElementById('fNama').value = item.NAMA;
        document.getElementById('fRole').value = item.ROLE;
        document.getElementById('fIdPemilik').value = item.ID_PEMILIK || '';
        document.getElementById('areaIdPemilik').style.display = (item.ROLE === 'PEMILIK KENDARAAN') ? 'block' : 'none';
        document.getElementById('fStatus').value = item.STATUS || 'AKTIF';
        document.getElementById('fPassword').value = '';
        document.getElementById('lblPassword').textContent = 'Password Baru';
        formModal.show();
      });
      $('#tblData').off('click', '.btnHapus').on('click', '.btnHapus', function () {
        const row = Number($(this).data('row'));
        Swal.fire({ title: 'Hapus user ini?', text: 'User tidak akan bisa login lagi setelah dihapus.', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e63946', confirmButtonText: 'Hapus' })
          .then(function (r) { if (r.isConfirmed) callServer('api_deleteUser', row).then(function () { toastSukses('Data dihapus'); muatData(); }); });
      });
    }

    document.getElementById('btnTambah').addEventListener('click', function () {
      document.getElementById('formModalTitle').textContent = 'Tambah User';
      document.getElementById('fRow').value = '';
      document.getElementById('fId').value = '';
      document.getElementById('fUsername').value = '';
      document.getElementById('fUsername').disabled = false;
      document.getElementById('fNama').value = '';
      document.getElementById('fRole').value = 'PETUGAS ANGKUTAN';
      document.getElementById('fIdPemilik').value = '';
      document.getElementById('areaIdPemilik').style.display = 'none';
      document.getElementById('fStatus').value = 'AKTIF';
      document.getElementById('fPassword').value = '';
      document.getElementById('lblPassword').textContent = 'Password';
      formModal.show();
    });

    document.getElementById('btnSimpan').addEventListener('click', function () {
      const isEdit = !!document.getElementById('fRow').value;
      const username = document.getElementById('fUsername').value.trim();
      const nama = document.getElementById('fNama').value.trim();
      const role = document.getElementById('fRole').value;
      const password = document.getElementById('fPassword').value.trim();

      if (!username || !nama) { Swal.fire({ icon: 'warning', title: 'Lengkapi data', text: 'Username dan Nama wajib diisi.' }); return; }
      if (!isEdit && !password) { Swal.fire({ icon: 'warning', title: 'Lengkapi data', text: 'Password wajib diisi untuk user baru.' }); return; }

      const data = {
        _row: document.getElementById('fRow').value || null,
        ID_USER: document.getElementById('fId').value,
        USERNAME: username,
        NAMA: nama,
        ROLE: role,
        ID_PEMILIK: role === 'PEMILIK KENDARAAN' ? document.getElementById('fIdPemilik').value.trim() : '',
        STATUS: document.getElementById('fStatus').value,
        PASSWORD: password || undefined
      };
      callServer('api_saveUser', data).then(function () { formModal.hide(); toastSukses('Data tersimpan'); muatData(); });
    });
  </script>
</body>
</html>
