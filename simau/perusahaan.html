<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMAU - Dinas Perhubungan Kota Balikpapan</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
</head>
<body>
  <div id="sidebarMount"></div>
  <div class="simantas-content">
    <div id="topbarMount"></div>
    <div class="page-body">
      <div class="card card-modern p-3">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h6 class="fw-semibold mb-0">Master Perusahaan</h6>
          <div class="d-flex gap-2">
            <button class="btn btn-primary btn-sm" id="btnTambah"><i class="fa-solid fa-plus"></i> Tambah</button>
            <button class="btn btn-outline-success btn-sm" id="btnExport"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="tblData" style="width:100%">
            <thead><tr><th>Nama Perusahaan</th><th>Alamat</th><th>Telepon</th><th class="no-print">Aksi</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h6 class="modal-title" id="formModalTitle">Tambah</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="fRow"><input type="hidden" id="fId">
        <div class="mb-2"><label class="form-label">Nama Perusahaan</label><input class="form-control" id="fNama" placeholder=""></div>
        <div class="mb-2"><label class="form-label">Alamat</label><textarea class="form-control" id="fAlamat" rows="2"></textarea></div>
        <div class="mb-2"><label class="form-label">Nomor Telepon</label><input class="form-control" id="fTelp" placeholder="08xxxxxxxxxx"></div>
        
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" id="btnSimpan">Simpan</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script>
    if (!requireLogin()) {}
    setupSidebar('perusahaan');
    initTopbar('Master Perusahaan');

    const FIELDS = [{id:'fNama',key:'NAMA_PERUSAHAAN'},{id:'fAlamat',key:'ALAMAT_PERUSAHAAN'},{id:'fTelp',key:'NOMOR_TELEPON'}];
    let dt, formModal, dataCache = [];

    document.addEventListener('DOMContentLoaded', function () {
      $.fn.dataTable.ext.errMode = 'none';
      formModal = new bootstrap.Modal(document.getElementById('formModal'));
      dt = $('#tblData').DataTable({ language: { url: 'https://cdn.datatables.net/plug-ins/1.13.8/i18n/id.json' } });
      muatData();
    });

    function muatData() {
      callServer('api_listPerusahaan').then(function (rows) {
        dataCache = rows || [];
        dt.clear();
        dataCache.forEach(function (r) {
          dt.row.add([r.NAMA_PERUSAHAAN || '-',r.ALAMAT_PERUSAHAAN || '-',r.NOMOR_TELEPON || '-',
            '<button class="btn btn-sm btn-outline-primary btnEdit me-1" data-row="' + r._row + '"><i class="fa-solid fa-pen"></i></button>' +
            '<button class="btn btn-sm btn-outline-danger btnHapus" data-row="' + r._row + '"><i class="fa-solid fa-trash"></i></button>'
          ]);
        });
        dt.draw();
      });
    }

    $('#tblData').on('click', '.btnEdit', function () {
      const row = Number($(this).data('row'));
      const item = dataCache.filter(function (d) { return d._row === row; })[0];
      if (!item) return;
      document.getElementById('formModalTitle').textContent = 'Edit';
      document.getElementById('fRow').value = item._row;
      document.getElementById('fId').value = item.ID_PERUSAHAAN;
      FIELDS.forEach(function (f) { document.getElementById(f.id).value = item[f.key] || ''; });
      formModal.show();
    });

    $('#tblData').on('click', '.btnHapus', function () {
      const row = Number($(this).data('row'));
      Swal.fire({ title: 'Hapus data ini?', text: 'Pastikan tidak sedang dipakai oleh data kendaraan.', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e63946', confirmButtonText: 'Hapus' })
        .then(function (r) {
          if (r.isConfirmed) callServer('api_deletePerusahaan', row).then(function () { toastSukses('Data dihapus'); muatData(); });
        });
    });

    document.getElementById('btnTambah').addEventListener('click', function () {
      document.getElementById('formModalTitle').textContent = 'Tambah';
      document.getElementById('fRow').value = '';
      document.getElementById('fId').value = '';
      FIELDS.forEach(function (f) { document.getElementById(f.id).value = ''; });
      formModal.show();
    });

    document.getElementById('btnSimpan').addEventListener('click', function () {
      const data = {};
      FIELDS.forEach(function (f) { data[f.key] = document.getElementById(f.id).value.trim(); });
      if (!data.NAMA_PERUSAHAAN) {
        Swal.fire({ icon: 'warning', title: 'Lengkapi data', text: 'Nama Perusahaan wajib diisi.' });
        return;
      }
      const row = document.getElementById('fRow').value;
      if (row) { data._row = Number(row); data.ID_PERUSAHAAN = document.getElementById('fId').value; }
      callServer('api_savePerusahaan', data).then(function () {
        formModal.hide(); toastSukses('Data tersimpan'); muatData();
      });
    });

    document.getElementById('btnExport').addEventListener('click', function () {
      if (!dataCache.length) { Swal.fire({ icon: 'info', title: 'Tidak ada data untuk diexport' }); return; }
      const rows = dataCache.map(function (r) { return { NAMA_PERUSAHAAN: r.NAMA_PERUSAHAAN || '-',ALAMAT_PERUSAHAAN: r.ALAMAT_PERUSAHAAN || '-',NOMOR_TELEPON: r.NOMOR_TELEPON || '-' }; });
      callServer('api_exportExcel', 'Master_Perusahaan', rows).then(function (res) { window.open(res.url, '_blank'); });
    });
  </script>
</body>
</html>
